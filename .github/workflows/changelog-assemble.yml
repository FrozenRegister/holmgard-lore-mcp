name: Assemble Changelog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview what would be assembled without writing/deleting anything'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble fragments into CHANGELOG.md
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/assemble-changelog.mjs --dry-run
          else
            node scripts/assemble-changelog.mjs
          fi

      - name: Commit assembled changelog
        if: inputs.dry_run != true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'changelog: assemble pending fragments into CHANGELOG.md'
          file_pattern: 'CHANGELOG.md .changelog/fragments/*.md'
