name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  surface-labels:
    name: Surface Area Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-label:
    name: Size Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            const changes = pr.additions + pr.deletions

            // Ordered smallest-first; first threshold the change count fits under wins.
            const thresholds = [
              { label: 'size/XS', max: 9 },
              { label: 'size/S', max: 29 },
              { label: 'size/M', max: 99 },
              { label: 'size/L', max: 499 },
            ]
            const allSizeLabels = [...thresholds.map((t) => t.label), 'size/XL']
            const sizeLabel = (thresholds.find((t) => changes <= t.max) || { label: 'size/XL' }).label

            const existing = pr.labels.map((l) => l.name)

            for (const label of allSizeLabels) {
              if (label !== sizeLabel && existing.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                })
              }
            }

            if (!existing.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [sizeLabel],
              })
            }

            console.log(`PR #${pr.number}: ${changes} changed lines (+${pr.additions}/-${pr.deletions}) -> ${sizeLabel}`)

  depth-label:
    name: Depth Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const filenames = files.map((f) => f.filename)
            const totalLines = pr.additions + pr.deletions

            // Diff-based analogue of issue-tagger.yml's text-based depth heuristic —
            // same depth:0-4 scale and labels, different signal (file paths/line count
            // instead of body length/keywords), since a PR has an actual diff to read.
            let depth = 1
            if (filenames.length >= 8) depth += 1
            if (totalLines >= 300) depth += 1

            // Paths where a small diff can still carry outsized risk (schema
            // migrations, CI/workflow definitions, the Durable Object).
            const riskyPrefixes = ['schema/migrations/', '.github/workflows/', 'src/do/']
            const riskyExact = ['wrangler.jsonc']
            if (
              filenames.some(
                (f) => riskyPrefixes.some((p) => f.startsWith(p)) || riskyExact.includes(f)
              )
            ) {
              depth += 1
            }

            // Pure docs/changelog PRs are trivial regardless of line count.
            const allDocsOrChangelog = filenames.every(
              (f) => f.startsWith('docs/') || f.endsWith('.md') || f.startsWith('.changelog/fragments/')
            )
            if (allDocsOrChangelog) depth -= 1

            depth = Math.min(4, Math.max(0, depth))
            const depthLabel = `depth:${depth}`

            const allDepthLabels = [0, 1, 2, 3, 4].map((n) => `depth:${n}`)
            const existing = pr.labels.map((l) => l.name)

            for (const label of allDepthLabels) {
              if (label !== depthLabel && existing.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                })
              }
            }

            if (!existing.includes(depthLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [depthLabel],
              })
            }

            console.log(`PR #${pr.number}: ${filenames.length} files, ${totalLines} lines -> ${depthLabel}`)
