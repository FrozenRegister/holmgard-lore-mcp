name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  surface-labels:
    name: Surface Area Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-label:
    name: Size Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const changes = pr.additions + pr.deletions

            // Ordered smallest-first; first threshold the change count fits under wins.
            const thresholds = [
              { label: 'size/XS', max: 9 },
              { label: 'size/S', max: 29 },
              { label: 'size/M', max: 99 },
              { label: 'size/L', max: 499 },
            ]
            const allSizeLabels = [...thresholds.map((t) => t.label), 'size/XL']
            const sizeLabel = (thresholds.find((t) => changes <= t.max) || { label: 'size/XL' }).label

            const existing = pr.labels.map((l) => l.name)

            for (const label of allSizeLabels) {
              if (label !== sizeLabel && existing.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                })
              }
            }

            if (!existing.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [sizeLabel],
              })
            }

            console.log(`PR #${pr.number}: ${changes} changed lines (+${pr.additions}/-${pr.deletions}) -> ${sizeLabel}`)
