name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: '10.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (report-only, never fails the build)
        run: |
          set +e
          pnpm audit > audit-report.txt 2>&1
          status=$?
          cat audit-report.txt

          {
            echo "## Dependency Audit (advisory — does not block merge)"
            echo
            if [ "$status" -eq 0 ]; then
              echo "No vulnerabilities found."
            else
              echo "\`pnpm audit\` found issues — see the job log above for full details."
              echo
              echo '```'
              tail -n 20 audit-report.txt
              echo '```'
              echo
              echo "This job is intentionally non-blocking: the existing findings backlog is"
              echo "tracked in [issue #576](https://github.com/FrozenRegister/holmgard-lore-mcp/issues/576),"
              echo "not something a merge-blocking gate can retroactively fix. New findings"
              echo "introduced by this PR's own dependency changes are still worth a look."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Always succeed — this is visibility, not enforcement. See #576/#577.
          exit 0
